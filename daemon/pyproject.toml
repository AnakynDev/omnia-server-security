[project]
name = "omnia-daemon"
version = "0.1.0"
description = "Background daemon for the Omnia server dashboard: SSH security monitoring and system health collection."
requires-python = ">=3.11"
dependencies = [
    "psutil>=6.0.0",
    "speedtest-cli>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
omnia-daemon = "omnia_daemon.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
